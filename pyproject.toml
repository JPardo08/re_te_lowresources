[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "re-te-lowresources"
version = "0.1.0"
description = "Local reproducibility helpers for the Paper-1 RE/TE low-resource survey methodology"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas==2.3.3",
    "xlrd==2.0.1",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
notebooks = [
    "nbconvert==7.17.1",
    "ipykernel==7.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]
